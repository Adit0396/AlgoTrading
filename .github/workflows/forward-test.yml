name: ORB forward test

# Simulation only. This workflow never places, stages or drafts an order.
# Runs after the US close: 21:23 UTC Mon-Fri = 4:23 PM New York (EST) / 5:23 PM (EDT)
# = 7:23 AM Brisbane Tue-Sat. GitHub often starts scheduled runs late (2-4 hours on this
# account); --catch-up fills any of the last 5 sessions that are missing, so a late or skipped run
# is picked up by the next one.

on:
  schedule:
    - cron: "23 21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "catch-up (missing sessions from the last 5), backfill or backfill N (redo the last 5 or N), or a date like 2026-10-30"
        required: false
        default: "catch-up"

permissions:
  contents: write

concurrency:
  group: forward-test
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the day-trader skill pack (pinned)
        run: |
          git clone --quiet https://github.com/Jakeschincariol/day-trader-skill.git day-trader-skill
          git -C day-trader-skill checkout --quiet 3d0f4ef6986f4984b7c6bd46f7ff4f87744c3abd

      - name: Run the forward test
        env:
          MODE: ${{ github.event.inputs.mode || 'catch-up' }}
          # Optional repo secret "Your Name you@example.com": adds SEC 8-K filings to the news check
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ "$MODE" = "catch-up" ]; then
            python -I forward_test.py --repo day-trader-skill --state forward-test-data --catch-up
          elif [[ "$MODE" =~ ^backfill( ([1-5]))?$ ]]; then
            python -I forward_test.py --repo day-trader-skill --state forward-test-data --backfill "${BASH_REMATCH[2]:-5}"
          else
            python -I forward_test.py --repo day-trader-skill --state forward-test-data --date "$MODE"
          fi

      - name: Save the results to the repo
        if: always()
        run: |
          git config user.name "orb-forward-test bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf forward-test-data/work
          git add forward-test-data
          if git diff --cached --quiet; then
            echo "No new results."
          else
            git commit -m "Forward test results $(date -u +%Y-%m-%d)"
            git pull --rebase --quiet origin main
            git push
          fi
