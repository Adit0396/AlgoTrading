name: ORB forward test

# Simulation only. This workflow never places, stages or drafts an order.
# Runs after the US close: 22:17 UTC Mon-Fri = 5:17 PM New York (EST) / 6:17 PM (EDT)
# = 8:17 AM Brisbane Tue-Sat. GitHub can start scheduled runs late at busy times.

on:
  schedule:
    - cron: "17 22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "catch-up (missing sessions from the last 5), backfill (redo the last 5), or a date like 2026-10-30"
        required: false
        default: "catch-up"

permissions:
  contents: write

concurrency:
  group: forward-test
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the day-trader skill pack (pinned)
        run: |
          git clone --quiet https://github.com/Jakeschincariol/day-trader-skill.git day-trader-skill
          git -C day-trader-skill checkout --quiet 3d0f4ef6986f4984b7c6bd46f7ff4f87744c3abd

      - name: Run the forward test
        env:
          MODE: ${{ github.event.inputs.mode || 'catch-up' }}
        run: |
          if [ "$MODE" = "catch-up" ]; then
            python -I forward_test.py --repo day-trader-skill --state forward-test-data --catch-up
          elif [ "$MODE" = "backfill" ]; then
            python -I forward_test.py --repo day-trader-skill --state forward-test-data --backfill 5
          else
            python -I forward_test.py --repo day-trader-skill --state forward-test-data --date "$MODE"
          fi

      - name: Save the results to the repo
        if: always()
        run: |
          git config user.name "orb-forward-test bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf forward-test-data/work
          git add forward-test-data
          if git diff --cached --quiet; then
            echo "No new results."
          else
            git commit -m "Forward test results $(date -u +%Y-%m-%d)"
            git push
          fi
